discord:
  tokenEnv: DISCORD_BOT_TOKEN
  slashCommands:
    enabled: true
    syncOnStart: true
    commandPrefix: omp
    # Expose every discovered OMP/ACP command. Safe core commands register directly
    # (/todo, /model, /tools); namespaced commands use runners like /skill and /codex.
    acpCommands: auto
  guilds:
    - id: "123456789012345678"
      allowedChannels: ["234567890123456789"]
      allowedUsers: []
      requireMention: true
      threadAutoArchiveMinutes: 1440
omp:
  cwd: "~/Developer"
  sessionRoot: "~/.omp/agent/discord-sessions"
  model: null
  thinkingLevel: medium
runtime:
  databasePath: "~/.omp/agent/discord-bridge.sqlite"
  maxConcurrency: 2
  maxAttachmentBytes: 25000000
  followupMode: steer # steer | queue
  discordMessageLimit: 1900
collab:
  # Share a thread's session live with an omp TUI that has it open (omp /collab protocol).
  # Point omp at the embedded relay:
  #   omp config set collab.autoStart control
  #   omp config set collab.relayUrl ws://127.0.0.1:7466
  enabled: true
  relayPort: 7466
  displayName: discord
