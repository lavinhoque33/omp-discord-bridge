discord:
  tokenEnv: DISCORD_BOT_TOKEN
  slashCommands:
    enabled: true
    syncOnStart: true
    commandPrefix: omp
    # Optional: expose ACP/OMP slash commands as Discord commands.
    # Requires omp.mode: acp for true ACP command handling; commands are sent as /<name> <input>.
    acpCommands:
      - name: todo
        description: Manage OMP todos
        inputHint: todo arguments
  guilds:
    - id: "123456789012345678"
      allowedChannels: ["234567890123456789"]
      allowedUsers: []
      requireMention: true
      threadAutoArchiveMinutes: 1440
omp:
  mode: rpc # rpc | acp | sdk
  cwd: "~/Developer"
  sessionRoot: "~/.omp/agent/discord-sessions"
  model: null
  thinkingLevel: medium
runtime:
  databasePath: "~/.omp/agent/discord-bridge.sqlite"
  maxConcurrency: 2
  maxAttachmentBytes: 25000000
  responseMode: edit-preview-then-final
  followupMode: steer # steer | queue
  discordMessageLimit: 1900
